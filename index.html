<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>yukksnake - Soft Pastel Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div id="loading-screen" class="screen">
        <div class="card">
            <div class="logo-title">yukksnake</div>
            <div class="subtitle">Memuat sumber daya gim...</div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="progress-text" class="progress-text">0%</div>
        </div>
    </div>

    <div id="login-screen" class="screen" style="display:none;">
        <div class="card login-card">
            <div class="logo-title login-title">yukksnake LOGIN</div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" maxlength="15" autocomplete="off" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" maxlength="15" placeholder="Masukkan password">
            </div>
            <div id="login-error" class="login-error"></div>
            <button id="login-button" class="login-button">MASUK</button>
            <div class="account-info">Akun demo: ayu / 123 &nbsp; | &nbsp; nella / 123</div>
        </div>
    </div>

    <div id="game-screen">
        <div id="header">
            <div id="user-info">yukksnake | -</div>
            <div id="score-info">Skor: 0 &nbsp; Best: 0</div>
        </div>

        <div id="game-area">
            <canvas id="gameCanvas"></canvas>

            <div id="mobile-controls">
                <button id="btn-up" class="control-button">▲</button>
                <button id="btn-left" class="control-button">◀</button>
                <button id="btn-down" class="control-button">▼</button>
                <button id="btn-right" class="control-button">▶</button>
            </div>

            <div id="game-over">
                <div class="game-over-card">
                    <div class="game-over-title">GAME OVER</div>
                    <div id="game-over-score" class="game-over-score">Skor: 0 | Best: 0</div>
                    <div class="restart-text">Tekan [ R ] atau tombol di bawah</div>
                    <button id="restart-button" class="login-button">MAIN LAGI</button>
                    <div class="exit-text">Tekan [ ESC ] untuk keluar</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

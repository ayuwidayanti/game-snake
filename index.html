<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Deluxe Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Screen Loading -->
    <div id="loadingScreen" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Game...</div>
    </div>

    <div class="game-container">
        <!-- Screen Login -->
        <div id="loginScreen" class="screen card">
            <div class="badge">V2.0 SOFT EDITION</div>
            <h1 class="title">Snake Deluxe</h1>
            <p class="subtitle">Selamat datang! Masukkan nama panggilanmu untuk mulai bermain.</p>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Masukkan Nama Kamu..." autocomplete="off" required maxlength="15">
                </div>
                <button type="submit" class="btn btn-primary">Mulai Permainan</button>
            </form>
        </div>

        <!-- Screen Game -->
        <div id="gameScreen" class="screen" style="display: none;">
            <!-- Top HUD / Header -->
            <div class="hud">
                <div class="hud-item">
                    <span class="hud-label">Pemain</span>
                    <span id="playerDisplay" class="hud-value">Player</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Skor</span>
                    <span id="scoreDisplay" class="hud-value highlight">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Rekor</span>
                    <span id="highScoreDisplay" class="hud-value">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Level</span>
                    <span id="levelDisplay" class="hud-value level">1</span>
                </div>
            </div>

            <!-- Canvas Game -->
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="800" height="560"></canvas>
            </div>

            <!-- D-Pad Kontrol Layar Sentuh untuk HP -->
            <div id="mobileControls" class="mobile-controls">
                <div class="dpad">
                    <button class="dpad-btn dpad-up" id="btnUp" aria-label="Atas">▲</button>
                    <button class="dpad-btn dpad-left" id="btnLeft" aria-label="Kiri">◄</button>
                    <button class="dpad-btn dpad-center" id="btnRestart" aria-label="Restart">↻</button>
                    <button class="dpad-btn dpad-right" id="btnRight" aria-label="Kanan">►</button>
                    <button class="dpad-btn dpad-down" id="btnDown" aria-label="Bawah">▼</button>
                </div>
            </div>

            <div class="controls-hint">
                Gunakan <b>W, A, S, D</b> / <b>Tombol Panah</b> / <b>D-Pad Layar</b> untuk bergerak | <b>R</b> untuk Restart
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Deluxe Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Screen Login -->
        <div id="loginScreen" class="screen card">
            <h1 class="title">SNAKE DELUXE PRO</h1>
            <p class="subtitle">Masukan username kamu untuk memulai</p>
            <form id="loginForm">
                <input type="text" id="usernameInput" placeholder="Masukkan Username..." autocomplete="off" required>
                <button type="submit" class="btn btn-primary">Mulai Bermain</button>
            </form>
        </div>

        <!-- Screen Game -->
        <div id="gameScreen" class="screen" style="display: none;">
            <!-- Top HUD / Header -->
            <div class="hud">
                <div class="hud-item">
                    <span class="hud-label">Pemain:</span>
                    <span id="playerDisplay" class="hud-value">Player</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Skor:</span>
                    <span id="scoreDisplay" class="hud-value highlight">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">High Score:</span>
                    <span id="highScoreDisplay" class="hud-value">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Level:</span>
                    <span id="levelDisplay" class="hud-value level">1</span>
                </div>
            </div>

            <!-- Canvas Game -->
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="800" height="580"></canvas>
            </div>

            <div class="controls-hint">
                Gunakan <b>W, A, S, D</b> atau <b>Tombol Panah</b> untuk bergerak | <b>R</b> untuk Restart
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
